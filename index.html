<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Invoice Generator</title>
  
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Load Babel to compile React JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Load PDF generation libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { background-color: #111827; }
    /* Hide scrollbar for a cleaner mobile look */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const invoiceRef = useRef(null);

      // Pre-filled with Pavan's Viral Editing Program details
      const [data, setData] = useState({
        logoText: 'Your Logo',
        billedToCompany: 'Client Name',
        billedToAddress: 'Client Address\nCity, Country - 00000',
        billedToPhone: '+0 (000) 123-4567',
        invoiceNumber: '#AB2324-02',
        reference: 'dev',
        subject: 'Viral Editing Program',
        invoiceDate: '19 Sep, 2026',
        dueDate: '26 Sep, 2026',
        items: [
          {
            id: 1,
            name: 'Complete Program (Editing & Growth)',
            description: 'Includes Viral Raw Clips, Carousel Pack, Page Setup, Initial Content, 1:1 Support & Monetization.',
            qty: 1,
            rate: 800,
          }
        ],
        taxRate: 0,
        bankName: 'ABCD BANK',
        ifsCode: 'ABCD000XXXX',
        swiftCode: 'ABCDUSBBXXX',
        accountNumber: '3747489 2300011',
        terms: 'Please pay within 15 days of receiving this invoice.'
      });

      const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });

      const handleItemChange = (id, field, value) => {
        const updatedItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
        setData({ ...data, items: updatedItems });
      };

      const addItem = () => setData({ ...data, items: [...data.items, { id: Date.now(), name: '', description: '', qty: 1, rate: 0 }] });
      const removeItem = (id) => setData({ ...data, items: data.items.filter(item => item.id !== id) });

      const handleDownloadPdf = async () => {
        const element = invoiceRef.current;
        const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0a0a0a' });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Invoice_${data.invoiceNumber}.pdf`);
      };

      const subtotal = data.items.reduce((acc, item) => acc + (item.qty * item.rate), 0);
      const taxAmount = subtotal * (data.taxRate / 100);
      const total = subtotal + taxAmount;
      const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);

      return (
        <div className="flex flex-col lg:flex-row text-gray-200 font-sans min-h-screen">
          
          {/* EDITOR PANEL */}
          <div className="w-full lg:w-1/3 bg-gray-800 p-6 overflow-y-auto lg:h-screen border-b lg:border-r border-gray-700">
            <h2 className="text-2xl font-bold mb-6 text-white">Invoice Details</h2>
            
            <button onClick={handleDownloadPdf} className="w-full mb-6 flex items-center justify-center gap-2 bg-white text-black px-6 py-3 rounded-lg font-bold shadow-lg">
              📥 Download PDF
            </button>

            <div className="space-y-4">
              <div>
                <label className="block text-xs text-gray-400 uppercase">Logo Text</label>
                <input type="text" name="logoText" value={data.logoText} onChange={handleChange} className="w-full bg-gray-700 p-2 rounded mt-1 text-white border border-gray-600 outline-none" />
              </div>

              <div className="pt-4 border-t border-gray-700">
                <h3 className="text-lg font-semibold mb-2 flex justify-between items-center">
                  Line Items
                  <button onClick={addItem} className="bg-blue-600 px-3 py-1 rounded text-white text-sm">+ Add</button>
                </h3>
                {data.items.map((item) => (
                  <div key={item.id} className="bg-gray-750 p-3 rounded border border-gray-600 mb-3 relative">
                    <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-red-400 text-sm">❌</button>
                    <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} placeholder="Item Name" className="w-full bg-gray-700 p-2 rounded mb-2 text-white text-sm outline-none pr-6" />
                    <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} placeholder="Description" className="w-full bg-gray-700 p-2 rounded mb-2 text-white text-sm outline-none h-16" />
                    <div className="flex gap-2">
                      <input type="number" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} placeholder="Qty" className="w-1/3 bg-gray-700 p-2 rounded text-white text-sm outline-none" />
                      <input type="number" value={item.rate} onChange={(e) => handleItemChange(item.id, 'rate', e.target.value)} placeholder="Rate" className="w-2/3 bg-gray-700 p-2 rounded text-white text-sm outline-none" />
                    </div>
                  </div>
                ))}
              </div>

              <div className="pt-4 border-t border-gray-700">
                <h3 className="text-lg font-semibold mb-2">Billed To</h3>
                <input type="text" name="billedToCompany" value={data.billedToCompany} onChange={handleChange} placeholder="Client Name" className="w-full bg-gray-700 p-2 rounded mb-2 text-white border border-gray-600 outline-none" />
                <textarea name="billedToAddress" value={data.billedToAddress} onChange={handleChange} placeholder="Address" className="w-full bg-gray-700 p-2 rounded mb-2 text-white border border-gray-600 outline-none h-20" />
              </div>
            </div>
          </div>

          {/* LIVE PREVIEW PANEL (Matches 46950.jpg) */}
          <div className="w-full lg:w-2/3 lg:h-screen overflow-y-auto bg-gray-900 p-4 sm:p-8 flex justify-center">
            
            {/* The exact invoice box that will be captured as PDF */}
            <div ref={invoiceRef} className="w-full max-w-[800px] bg-[#0a0a0a] text-white p-8 sm:p-12 shadow-2xl rounded-lg">
              <div className="mb-10">
                <p className="text-gray-400 text-sm font-semibold tracking-wider mb-1">{data.logoText}</p>
                <h1 className="text-3xl sm:text-4xl font-bold tracking-widest">INVOICE</h1>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 mb-10">
                <div className="col-span-1">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Billed to</p>
                  <p className="font-semibold text-sm">{data.billedToCompany}</p>
                  <p className="text-gray-400 text-sm whitespace-pre-line leading-snug mt-1">{data.billedToAddress}</p>
                  <p className="text-gray-400 text-sm mt-1">{data.billedToPhone}</p>
                </div>
                <div className="col-span-1">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Invoice number</p>
                  <p className="font-semibold text-sm">{data.invoiceNumber}</p>
                  <p className="text-gray-500 text-[10px] mt-4 mb-1 uppercase tracking-wider">Reference</p>
                  <p className="font-semibold text-sm">{data.reference}</p>
                </div>
                <div className="col-span-2 sm:text-right">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Invoice of (USD)</p>
                  <p className="text-2xl sm:text-3xl font-bold">{formatCurrency(total)}</p>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 mb-8">
                <div className="col-span-1">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Subject</p>
                  <p className="font-semibold text-sm">{data.subject}</p>
                </div>
                <div className="col-span-1">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Invoice Date</p>
                  <p className="font-semibold text-sm">{data.invoiceDate}</p>
                </div>
                <div className="col-span-2 sm:text-right">
                  <p className="text-gray-500 text-[10px] mb-1 uppercase tracking-wider">Due Date</p>
                  <p className="font-semibold text-sm">{data.dueDate}</p>
                </div>
              </div>

              <div className="mb-8">
                <div className="flex border-b border-gray-800 pb-2 mb-4">
                  <div className="w-1/2 text-gray-500 text-[10px] uppercase tracking-wider">Item Detail</div>
                  <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-wider">Qty</div>
                  <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-wider">Rate</div>
                  <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-wider">Amount</div>
                </div>
                
                {data.items.map((item) => (
                  <div key={item.id} className="flex py-3 border-b border-gray-800">
                    <div className="w-1/2 pr-2">
                      <p className="font-semibold text-sm">{item.name}</p>
                      <p className="text-gray-500 text-xs mt-1 leading-relaxed">{item.description}</p>
                    </div>
                    <div className="w-1/6 text-right text-sm">{item.qty}</div>
                    <div className="w-1/6 text-right text-sm">{formatCurrency(item.rate)}</div>
                    <div className="w-1/6 text-right text-sm font-semibold">{formatCurrency(item.qty * item.rate)}</div>
                  </div>
                ))}
              </div>

              <div className="flex justify-end mb-12">
                <div className="w-full sm:w-64">
                  <div className="flex justify-between py-2">
                    <span className="text-gray-400 text-sm">Subtotal</span>
                    <span className="text-sm">{formatCurrency(subtotal)}</span>
                  </div>
                  <div className="flex justify-between py-3">
                    <span className="font-bold text-lg">Total</span>
                    <span className="font-bold text-lg text-white">{formatCurrency(total)}</span>
                  </div>
                </div>
              </div>

              <div>
                <h3 className="font-semibold text-sm mb-2">Terms & Conditions</h3>
                <p className="text-gray-500 text-xs mb-6">{data.terms}</p>
                
                <div className="grid grid-cols-2 gap-y-2 gap-x-4 max-w-sm">
                  <div className="text-gray-500 text-xs">Bank name</div>
                  <div className="text-sm font-semibold">{data.bankName}</div>
                  <div className="text-gray-500 text-xs">Account #</div>
                  <div className="text-sm font-semibold">{data.accountNumber}</div>
                </div>
              </div>
            </div>
            
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
