<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePro - Responsive & Professional</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { bgPrimary: '#0a192f', accent: '#3b82f6', surface: '#1e293b', textMain: '#f8fafc' }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0a192f; color: #f8fafc; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a192f; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    
    .glass-panel { background-color: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(248, 250, 252, 0.08); border-radius: 1rem; }
    .input-modern { width: 100%; background-color: rgba(10, 25, 47, 0.5); border: 1px solid rgba(248, 250, 252, 0.1); color: #f8fafc; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; transition: all 0.3s ease; outline: none; }
    .input-modern:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .input-label { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-bottom: 0.375rem; }
    
    /* Ensures the invoice preview never squishes, matching 46950_2.jpg */
    .invoice-wrapper { min-width: 800px; width: 800px; }
    
    .ambient-glow { position: fixed; top: -10%; right: -5%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(10,25,47,0) 70%); z-index: 0; pointer-events: none; }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const defaultData = {
      currency: 'USD',
      accentColor: '#ffffff', 
      fontFamily: "'Inter', sans-serif", // Default Professional Font
      logoImage: null,
      clientEmail: '',
      billedToCompany: 'Company Name',
      billedToAddress: 'Company address\nCity, Country - 00000',
      billedToPhone: '+0 (000) 123-4567',
      invoiceNumber: '#AB2324-01',
      reference: 'dev',
      subject: 'Design System',
      invoiceDate: '01 Aug, 2026',
      dueDate: '15 Aug, 2026',
      items: [
        { id: 1, name: 'Item Name', description: 'Item description', qty: 1, rate: 3000 },
        { id: 2, name: 'Item Name', description: 'Item description', qty: 1, rate: 1500 }
      ],
      taxRate: 10,
      discount: 0,
      bankName: 'ABCD BANK',
      ifsCode: 'ABCD000XXXX',
      swiftCode: 'ABCDUSBBXXX',
      accountNumber: '3747489 2300011',
      terms: 'Please pay within 15 days of receiving this invoice.'
    };

    function App() {
      const invoiceRef = useRef(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [data, setData] = useState(defaultData);
      
      const [templateName, setTemplateName] = useState('');
      const [savedTemplates, setSavedTemplates] = useState({});

      useEffect(() => {
        const savedDraft = localStorage.getItem('invoiceDraft_v2');
        const templates = localStorage.getItem('invoiceTemplates_v2');
        if (savedDraft) setData(JSON.parse(savedDraft));
        if (templates) setSavedTemplates(JSON.parse(templates));
      }, []);

      useEffect(() => {
        localStorage.setItem('invoiceDraft_v2', JSON.stringify(data));
      }, [data]);

      const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });
      const handleItemChange = (id, field, value) => {
        const updatedItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
        setData({ ...data, items: updatedItems });
      };
      const addItem = () => setData({ ...data, items: [...data.items, { id: Date.now(), name: '', description: '', qty: 1, rate: 0 }] });
      const removeItem = (id) => setData({ ...data, items: data.items.filter(item => item.id !== id) });
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setData({ ...data, logoImage: reader.result });
          reader.readAsDataURL(file);
        }
      };

      const saveTemplate = () => {
        if (!templateName) return alert("Please enter a template name");
        const updatedTemplates = { ...savedTemplates, [templateName]: data };
        setSavedTemplates(updatedTemplates);
        localStorage.setItem('invoiceTemplates_v2', JSON.stringify(updatedTemplates));
        setTemplateName('');
        alert(`Template "${templateName}" saved!`);
      };

      const loadTemplate = (e) => {
        const selected = e.target.value;
        if (selected && savedTemplates[selected]) setData(savedTemplates[selected]);
      };

      const subtotal = data.items.reduce((acc, item) => acc + (Number(item.qty) * Number(item.rate)), 0);
      const discountAmount = Number(data.discount) || 0;
      const taxableAmount = Math.max(0, subtotal - discountAmount);
      const taxAmount = taxableAmount * (Number(data.taxRate) / 100);
      const total = taxableAmount + taxAmount;
      
      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: data.currency }).format(amount);
      };

      const handleDownloadPdf = async () => {
        setIsGenerating(true);
        const element = invoiceRef.current;
        element.style.transform = 'none'; 
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0a0a0a', useCORS: true, windowWidth: 800 });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Invoice_${data.invoiceNumber}.pdf`);
        } catch(e) { console.error(e); } finally { setIsGenerating(false); }
      };

      const handleSendEmail = () => {
        const subject = encodeURIComponent(`Invoice ${data.invoiceNumber} for ${data.subject}`);
        const body = encodeURIComponent(
          `Dear ${data.billedToCompany},\n\n` +
          `I hope this email finds you well.\n\n` +
          `Please find attached the invoice (${data.invoiceNumber}) for the recent ${data.subject} services.\n\n` +
          `Invoice Summary:\n` +
          `• Invoice Date: ${data.invoiceDate}\n` +
          `• Due Date: ${data.dueDate}\n` +
          `• Total Amount Due: ${formatCurrency(total)}\n\n` +
          `For your convenience, payment can be made via wire transfer using the details provided within the attached document or below:\n` +
          `• Bank Name: ${data.bankName}\n` +
          `• Account Number: ${data.accountNumber}\n` +
          `• SWIFT Code: ${data.swiftCode}\n\n` +
          `If you have any questions regarding this invoice, please don't hesitate to reach out. We greatly appreciate your business!\n\n` +
          `Best regards,\n\n` +
          `[Your Name/Company]`
        );
        window.location.href = `mailto:${data.clientEmail}?subject=${subject}&body=${body}`;
      };

      return (
        <div className="relative min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white">
          <div className="ambient-glow"></div>

          {/* Header - Fully Responsive */}
          <header className="relative z-10 p-4 lg:p-6 border-b border-white/5 bg-surface/80 backdrop-blur-md flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded bg-gradient-to-br from-accent to-blue-700 flex items-center justify-center font-bold text-white shadow-lg">I</div>
              <h1 className="text-xl font-bold tracking-tight">Invoice<span className="text-accent">Pro</span></h1>
            </div>
            <div className="flex flex-wrap justify-center items-center gap-2 sm:gap-3 w-full sm:w-auto">
              <button onClick={handleDownloadPdf} disabled={isGenerating} className="flex-1 sm:flex-none px-4 py-2.5 bg-accent hover:bg-blue-400 text-white font-bold rounded-lg transition shadow-[0_0_15px_rgba(59,130,246,0.3)] disabled:opacity-50 text-sm text-center">
                {isGenerating ? 'Building...' : '1. Download PDF'}
              </button>
              <button onClick={handleSendEmail} className="flex-1 sm:flex-none px-4 py-2.5 bg-surface hover:bg-gray-700 text-white font-semibold rounded-lg transition border border-white/10 text-sm flex justify-center items-center gap-2 group relative">
                ✉️ 2. Draft Email
              </button>
            </div>
          </header>
          
          {/* Main Layout - Stacks on mobile, side-by-side on desktop xl */}
          <main className="flex flex-col xl:flex-row flex-1 relative z-10 p-4 sm:p-6 lg:p-8 gap-8 max-w-[1920px] mx-auto w-full">
            
            {/* LEFT SIDEBAR: CONFIG & CALCULATOR */}
            <div className="w-full xl:w-[450px] shrink-0 flex flex-col gap-6">
              
              {/* Settings, Fonts & Templates */}
              <div className="glass-panel p-5 sm:p-6 shadow-xl border-accent/30">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="text-accent">⚙️</span> Settings & Style</h2>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4 border-b border-white/10 pb-4">
                  <div>
                    <label className="input-label">Typography</label>
                    <select name="fontFamily" value={data.fontFamily} onChange={handleChange} className="input-modern bg-gray-800">
                      <option value="'Inter', sans-serif">Inter (Modern & Clean)</option>
                      <option value="'Roboto', sans-serif">Roboto (Tech & Standard)</option>
                      <option value="'Montserrat', sans-serif">Montserrat (Geometric)</option>
                      <option value="'Lato', sans-serif">Lato (Warm & Professional)</option>
                      <option value="'Playfair Display', serif">Playfair (Elegant Serif)</option>
                    </select>
                  </div>
                  <div>
                    <label className="input-label">Currency</label>
                    <select name="currency" value={data.currency} onChange={handleChange} className="input-modern bg-gray-800">
                      <option value="USD">USD ($)</option>
                      <option value="EUR">EUR (€)</option>
                      <option value="GBP">GBP (£)</option>
                      <option value="INR">INR (₹)</option>
                    </select>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <div>
                    <label className="input-label">Load Template</label>
                    <select onChange={loadTemplate} className="input-modern bg-gray-800 text-gray-300">
                      <option value="">-- Select a saved template --</option>
                      {Object.keys(savedTemplates).map(name => (
                        <option key={name} value={name}>{name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={templateName} onChange={(e) => setTemplateName(e.target.value)} placeholder="Save as (e.g. Client A)" className="input-modern text-xs" />
                    <button onClick={saveTemplate} className="bg-surface hover:bg-gray-600 px-4 rounded text-white text-xs font-bold border border-white/10">Save</button>
                  </div>
                </div>
              </div>

              {/* Detail Panels (Condensed for space) */}
              <div className="glass-panel p-5 sm:p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 text-accent">01. Details</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="sm:col-span-2">
                    <label className="input-label">Company Logo</label>
                    {data.logoImage ? (
                      <div className="flex items-center justify-between bg-bgPrimary/50 p-2 rounded-lg border border-white/5"><img src={data.logoImage} alt="Logo" className="h-8 object-contain" /><button onClick={() => setData({ ...data, logoImage: null })} className="text-red-400 text-xs font-bold">Remove</button></div>
                    ) : (
                      <input type="file" accept="image/*" onChange={handleLogoUpload} className="input-modern p-2 text-xs" />
                    )}
                  </div>
                  <div><label className="input-label">Invoice #</label><input type="text" name="invoiceNumber" value={data.invoiceNumber} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Reference</label><input type="text" name="reference" value={data.reference} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Invoice Date</label><input type="text" name="invoiceDate" value={data.invoiceDate} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Due Date</label><input type="text" name="dueDate" value={data.dueDate} onChange={handleChange} className="input-modern" /></div>
                  <div className="sm:col-span-2"><label className="input-label">Subject</label><input type="text" name="subject" value={data.subject} onChange={handleChange} className="input-modern" /></div>
                </div>
              </div>

              <div className="glass-panel p-5 sm:p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 text-accent">02. Client</h2>
                <div className="space-y-3">
                  <div><label className="input-label">Client Email (For Auto-Mail)</label><input type="email" name="clientEmail" value={data.clientEmail} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Company Name</label><input type="text" name="billedToCompany" value={data.billedToCompany} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Address</label><textarea name="billedToAddress" value={data.billedToAddress} onChange={handleChange} className="input-modern h-16 resize-none"></textarea></div>
                  <div><label className="input-label">Phone</label><input type="text" name="billedToPhone" value={data.billedToPhone} onChange={handleChange} className="input-modern" /></div>
                </div>
              </div>

              <div className="glass-panel p-5 sm:p-6 shadow-xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-accent">03. Items</h2>
                  <button onClick={addItem} className="text-xs bg-surface hover:bg-gray-600 px-3 py-1.5 rounded text-white font-bold">+ Add</button>
                </div>
                <div className="space-y-4">
                  {data.items.map((item) => (
                    <div key={item.id} className="bg-bgPrimary/40 p-3 sm:p-4 rounded-xl border border-white/5 relative">
                      <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-red-400 text-xs">✕</button>
                      <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} placeholder="Item Name" className="input-modern mb-2 text-xs font-bold pr-6" />
                      <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} placeholder="Description" className="input-modern h-12 mb-2 text-xs resize-none"></textarea>
                      <div className="flex gap-2">
                        <div className="w-1/3"><label className="input-label">Qty</label><input type="number" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} className="input-modern text-xs" /></div>
                        <div className="w-2/3"><label className="input-label">Rate</label><input type="number" value={item.rate} onChange={(e) => handleItemChange(item.id, 'rate', e.target.value)} className="input-modern text-xs" /></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="glass-panel p-5 sm:p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 text-accent">04. Financials</h2>
                <div className="grid grid-cols-2 gap-4 mb-4">
                  <div><label className="input-label">Tax Rate (%)</label><input type="number" name="taxRate" value={data.taxRate} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Discount ({data.currency})</label><input type="number" name="discount" value={data.discount} onChange={handleChange} className="input-modern" /></div>
                </div>
                <div className="space-y-3 pt-4 border-t border-white/5">
                  <div><label className="input-label">Bank Name</label><input type="text" name="bankName" value={data.bankName} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Account Number</label><input type="text" name="accountNumber" value={data.accountNumber} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">SWIFT / Routing</label><input type="text" name="swiftCode" value={data.swiftCode} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Terms</label><textarea name="terms" value={data.terms} onChange={handleChange} className="input-modern h-16 resize-none"></textarea></div>
                </div>
              </div>

            </div>

            {/* RIGHT SIDE: LIVE INVOICE PREVIEW 
                Horizontally scrollable on small screens to strictly protect formatting 
            */}
            <div className="flex-1 w-full overflow-hidden rounded-xl border border-white/10 bg-[#0a0a0a]/50">
              <div className="w-full h-full overflow-x-auto custom-scrollbar flex justify-start xl:justify-center p-4 sm:p-8">
                
                {/* THE INVOICE - STRICT FORMAT MATCHING 46950_2.jpg & 45396.jpg */}
                <div 
                  ref={invoiceRef} 
                  className="invoice-wrapper bg-[#080808] text-white p-12 sm:p-16 shadow-2xl relative"
                  style={{ fontFamily: data.fontFamily }}
                >
                  
                  {/* Header Area */}
                  <div className="mb-16 pt-2 flex flex-col justify-start items-start">
                    {data.logoImage ? (
                      <img src={data.logoImage} alt="Logo" className="h-10 object-contain mb-6" />
                    ) : (
                      <p className="text-gray-400 text-xs font-semibold tracking-wider mb-4">Your Logo</p>
                    )}
                    <h1 className="text-4xl font-bold tracking-widest text-white uppercase">INVOICE <span className="text-xs text-gray-500 font-normal tracking-normal normal-case ml-2">(1 of 2)</span></h1>
                  </div>

                  {/* Top Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Billed to</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.billedToCompany}</p>
                      <p className="text-gray-400 text-[11px] whitespace-pre-line leading-relaxed mt-1">{data.billedToAddress}</p>
                      <p className="text-gray-400 text-[11px] mt-1">{data.billedToPhone}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice number</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.invoiceNumber}</p>
                      <p className="text-gray-500 text-[9px] mt-8 mb-2 uppercase tracking-widest font-semibold">Reference</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.reference}</p>
                    </div>
                    <div className="col-span-2 text-right">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice of ({data.currency})</p>
                      <p className="text-[28px] font-bold text-white">{formatCurrency(total)}</p>
                    </div>
                  </div>

                  {/* Dates Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Subject</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.subject}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice Date</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.invoiceDate}</p>
                    </div>
                    <div className="col-span-2 text-right">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Due Date</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.dueDate}</p>
                    </div>
                  </div>

                  {/* Items Table */}
                  <div className="mb-12">
                    <div className="flex pb-3 mb-4 border-b border-gray-800">
                      <div className="w-1/2 text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Item Detail</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Qty</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Rate</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Amount</div>
                    </div>
                    
                    {data.items.map((item) => (
                      <div key={item.id} className="flex py-3 border-b border-gray-800/50">
                        <div className="w-1/2 pr-6">
                          <p className="font-bold text-[13px] text-gray-100">{item.name}</p>
                          <p className="text-gray-500 text-[11px] mt-1 leading-relaxed">{item.description}</p>
                        </div>
                        <div className="w-1/6 text-right text-[12px] text-gray-300">{item.qty}</div>
                        <div className="w-1/6 text-right text-[12px] text-gray-300">{formatCurrency(item.rate)}</div>
                        <div className="w-1/6 text-right text-[13px] font-bold text-gray-100">{formatCurrency(item.qty * item.rate)}</div>
                      </div>
                    ))}
                  </div>

                  {/* Calculations */}
                  <div className="flex justify-end mb-16">
                    <div className="w-72">
                      <div className="flex justify-between py-1.5 text-[13px]">
                        <span className="text-gray-400">Subtotal</span>
                        <span className="text-gray-200">{formatCurrency(subtotal)}</span>
                      </div>
                      {discountAmount > 0 && (
                        <div className="flex justify-between py-1.5 text-[13px]">
                          <span className="text-gray-400">Discount</span>
                          <span className="text-gray-200">-{formatCurrency(discountAmount)}</span>
                        </div>
                      )}
                      <div className="flex justify-between py-1.5 text-[13px] border-b border-gray-800 pb-3">
                        <span className="text-gray-400">Tax ({data.taxRate}%)</span>
                        <span className="text-gray-200">{formatCurrency(taxAmount)}</span>
                      </div>
                      <div className="flex justify-between py-3 mt-1">
                        <span className="font-bold text-[15px] text-white">Total</span>
                        <span className="font-bold text-[15px] text-white">{formatCurrency(total)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Footer Terms */}
                  <div className="pt-8">
                    <h3 className="font-bold text-[12px] text-gray-100 mb-1">Terms & Conditions</h3>
                    <p className="text-gray-500 text-[10px] mb-8">{data.terms}</p>
                    
                    <div className="grid grid-cols-[100px_1fr] gap-y-1 gap-x-4 max-w-sm">
                      <p className="text-gray-500 text-[10px]">Bank name</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.bankName}</p>
                      
                      <p className="text-gray-500 text-[10px]">IFS code</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.ifsCode}</p>
                      
                      <p className="text-gray-500 text-[10px]">Swift code</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.swiftCode}</p>

                      <p className="text-gray-500 text-[10px]">Account #</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.accountNumber}</p>
                    </div>
                  </div>

                </div>
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
