<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Invoice Generator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { background-color: #111827; }
    /* Hide scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    .invoice-wrapper {
      /* Forces the preview to maintain desktop aspect ratio on mobile */
      min-width: 800px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const invoiceRef = useRef(null);

      const [data, setData] = useState({
        logoImage: null,
        billedToCompany: 'Client Name',
        billedToAddress: 'Client Address\nCity, Country - 00000',
        billedToPhone: '+0 (000) 123-4567',
        invoiceNumber: '#AB2324-02',
        reference: 'dev',
        subject: 'Viral Editing Program',
        invoiceDate: '19 Sep, 2026',
        dueDate: '26 Sep, 2026',
        items: [
          {
            id: 1,
            name: 'Complete Program (Editing & Growth)',
            description: 'Includes Viral Raw Clips, Carousel Pack, Page Setup, Initial Content, 1:1 Support & Monetization.',
            qty: 1,
            rate: 800,
          }
        ],
        taxRate: 0,
        bankName: 'ABCD BANK',
        ifsCode: 'ABCD000XXXX',
        swiftCode: 'ABCDUSBBXXX',
        accountNumber: '3747489 2300011',
        terms: 'Please pay within 15 days of receiving this invoice.'
      });

      const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });

      const handleItemChange = (id, field, value) => {
        const updatedItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
        setData({ ...data, items: updatedItems });
      };

      const addItem = () => setData({ ...data, items: [...data.items, { id: Date.now(), name: '', description: '', qty: 1, rate: 0 }] });
      const removeItem = (id) => setData({ ...data, items: data.items.filter(item => item.id !== id) });

      // Handle Logo Upload
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setData({ ...data, logoImage: reader.result });
          reader.readAsDataURL(file);
        }
      };

      const removeLogo = () => setData({ ...data, logoImage: null });

      // Robust PDF Download Function
      const handleDownloadPdf = async () => {
        const element = invoiceRef.current;
        
        // Temporarily adjust styling to ensure perfect capture regardless of screen size
        element.style.transform = 'none'; 
        
        const canvas = await html2canvas(element, { 
          scale: 2, 
          backgroundColor: '#0a0a0a',
          useCORS: true,
          windowWidth: 800 // Forces A4 width capture even on mobile
        });
        
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`Invoice_${data.invoiceNumber}.pdf`);
      };

      const subtotal = data.items.reduce((acc, item) => acc + (item.qty * item.rate), 0);
      const taxAmount = subtotal * (data.taxRate / 100);
      const total = subtotal + taxAmount;
      const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);

      return (
        <div className="flex flex-col lg:flex-row text-gray-200 font-sans min-h-screen">
          
          {/* EDITOR PANEL */}
          <div className="w-full lg:w-[400px] bg-gray-800 p-5 overflow-y-auto lg:h-screen border-b lg:border-r border-gray-700 shadow-xl z-10">
            <h2 className="text-xl font-bold mb-4 text-white">Edit Invoice</h2>
            
            <button onClick={handleDownloadPdf} className="w-full mb-6 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded font-bold transition">
              Download PDF
            </button>

            <div className="space-y-5">
              
              {/* Logo Upload Section */}
              <div className="bg-gray-700 p-3 rounded">
                <label className="block text-xs text-gray-400 uppercase font-semibold mb-2">Company Logo</label>
                {data.logoImage ? (
                  <div className="flex items-center justify-between">
                    <img src={data.logoImage} alt="Logo preview" className="h-10 object-contain" />
                    <button onClick={removeLogo} className="text-red-400 text-xs">Remove</button>
                  </div>
                ) : (
                  <input type="file" accept="image/*" onChange={handleLogoUpload} className="text-sm text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500 cursor-pointer w-full" />
                )}
              </div>

              {/* Invoice Info */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[10px] text-gray-400 uppercase">Invoice #</label>
                  <input type="text" name="invoiceNumber" value={data.invoiceNumber} onChange={handleChange} className="w-full bg-gray-700 p-2 rounded mt-1 text-sm outline-none" />
                </div>
                <div>
                  <label className="block text-[10px] text-gray-400 uppercase">Subject</label>
                  <input type="text" name="subject" value={data.subject} onChange={handleChange} className="w-full bg-gray-700 p-2 rounded mt-1 text-sm outline-none" />
                </div>
                <div>
                  <label className="block text-[10px] text-gray-400 uppercase">Invoice Date</label>
                  <input type="text" name="invoiceDate" value={data.invoiceDate} onChange={handleChange} className="w-full bg-gray-700 p-2 rounded mt-1 text-sm outline-none" />
                </div>
                <div>
                  <label className="block text-[10px] text-gray-400 uppercase">Due Date</label>
                  <input type="text" name="dueDate" value={data.dueDate} onChange={handleChange} className="w-full bg-gray-700 p-2 rounded mt-1 text-sm outline-none" />
                </div>
              </div>

              {/* Billed To */}
              <div className="bg-gray-700 p-3 rounded">
                <label className="block text-xs text-gray-400 uppercase font-semibold mb-2">Billed To</label>
                <input type="text" name="billedToCompany" value={data.billedToCompany} onChange={handleChange} placeholder="Company/Client Name" className="w-full bg-gray-800 p-2 rounded mb-2 text-sm outline-none" />
                <textarea name="billedToAddress" value={data.billedToAddress} onChange={handleChange} placeholder="Address" className="w-full bg-gray-800 p-2 rounded mb-2 text-sm outline-none h-16" />
                <input type="text" name="billedToPhone" value={data.billedToPhone} onChange={handleChange} placeholder="Phone Number" className="w-full bg-gray-800 p-2 rounded text-sm outline-none" />
              </div>

              {/* Line Items */}
              <div>
                <div className="flex justify-between items-center mb-2">
                  <label className="block text-xs text-gray-400 uppercase font-semibold">Line Items</label>
                  <button onClick={addItem} className="text-blue-400 text-xs font-semibold">+ Add Item</button>
                </div>
                {data.items.map((item) => (
                  <div key={item.id} className="bg-gray-700 p-3 rounded mb-2 relative">
                    <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-red-400 text-xs font-bold">✕</button>
                    <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} placeholder="Item Name" className="w-full bg-gray-800 p-2 rounded mb-2 text-sm outline-none pr-6" />
                    <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} placeholder="Description" className="w-full bg-gray-800 p-2 rounded mb-2 text-sm outline-none h-12" />
                    <div className="flex gap-2">
                      <input type="number" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} placeholder="Qty" className="w-1/4 bg-gray-800 p-2 rounded text-sm outline-none" />
                      <input type="number" value={item.rate} onChange={(e) => handleItemChange(item.id, 'rate', e.target.value)} placeholder="Rate" className="w-3/4 bg-gray-800 p-2 rounded text-sm outline-none" />
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </div>

          {/* LIVE PREVIEW PANEL */}
          <div className="flex-1 bg-gray-900 p-4 lg:p-8 overflow-auto lg:h-screen flex justify-center items-start">
            
            {/* Scrollable container for mobile to prevent squishing */}
            <div className="overflow-x-auto w-full flex justify-center pb-8">
              
              {/* THE INVOICE (Fixed width to match 46950.jpg perfectly) */}
              <div ref={invoiceRef} className="invoice-wrapper w-[800px] bg-[#0a0a0a] text-white p-12 shadow-2xl rounded-lg">
                
                {/* Header */}
                <div className="mb-14">
                  {data.logoImage ? (
                    <img src={data.logoImage} alt="Company Logo" className="h-12 object-contain mb-4" />
                  ) : (
                    <div className="h-12 mb-4"></div>
                  )}
                  <h1 className="text-4xl font-bold tracking-widest text-white">INVOICE</h1>
                </div>

                {/* Top Grid */}
                <div className="grid grid-cols-4 gap-6 mb-12">
                  <div className="col-span-1">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Billed to</p>
                    <p className="font-semibold text-sm text-gray-100">{data.billedToCompany}</p>
                    <p className="text-gray-400 text-xs whitespace-pre-line leading-relaxed mt-1">{data.billedToAddress}</p>
                    <p className="text-gray-400 text-xs mt-1">{data.billedToPhone}</p>
                  </div>
                  <div className="col-span-1">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Invoice number</p>
                    <p className="font-semibold text-sm text-gray-100">{data.invoiceNumber}</p>
                    <p className="text-gray-500 text-[9px] mt-6 mb-1 uppercase tracking-widest">Reference</p>
                    <p className="font-semibold text-sm text-gray-100">{data.reference}</p>
                  </div>
                  <div className="col-span-2 text-right">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Invoice of (USD)</p>
                    <p className="text-3xl font-bold text-white">{formatCurrency(total)}</p>
                  </div>
                </div>

                {/* Dates Grid */}
                <div className="grid grid-cols-4 gap-6 mb-10">
                  <div className="col-span-1">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Subject</p>
                    <p className="font-semibold text-sm text-gray-100">{data.subject}</p>
                  </div>
                  <div className="col-span-1">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Invoice Date</p>
                    <p className="font-semibold text-sm text-gray-100">{data.invoiceDate}</p>
                  </div>
                  <div className="col-span-2 text-right">
                    <p className="text-gray-500 text-[9px] mb-1 uppercase tracking-widest">Due Date</p>
                    <p className="font-semibold text-sm text-gray-100">{data.dueDate}</p>
                  </div>
                </div>

                {/* Items Table */}
                <div className="mb-10">
                  <div className="flex border-b border-gray-800 pb-3 mb-4">
                    <div className="w-1/2 text-gray-500 text-[9px] uppercase tracking-widest">Item Detail</div>
                    <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest">Qty</div>
                    <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest">Rate</div>
                    <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest">Amount</div>
                  </div>
                  
                  {data.items.map((item) => (
                    <div key={item.id} className="flex py-4 border-b border-gray-800">
                      <div className="w-1/2 pr-4">
                        <p className="font-semibold text-sm text-gray-100">{item.name}</p>
                        <p className="text-gray-500 text-xs mt-1 leading-relaxed">{item.description}</p>
                      </div>
                      <div className="w-1/6 text-right text-sm text-gray-300">{item.qty}</div>
                      <div className="w-1/6 text-right text-sm text-gray-300">{formatCurrency(item.rate)}</div>
                      <div className="w-1/6 text-right text-sm font-semibold text-gray-100">{formatCurrency(item.qty * item.rate)}</div>
                    </div>
                  ))}
                </div>

                {/* Totals */}
                <div className="flex justify-end mb-14">
                  <div className="w-64">
                    <div className="flex justify-between py-2">
                      <span className="text-gray-400 text-sm">Subtotal</span>
                      <span className="text-sm text-gray-100">{formatCurrency(subtotal)}</span>
                    </div>
                    <div className="flex justify-between py-4 border-t border-gray-800 mt-2">
                      <span className="font-bold text-lg text-white">Total</span>
                      <span className="font-bold text-lg text-white">{formatCurrency(total)}</span>
                    </div>
                  </div>
                </div>

                {/* Footer terms */}
                <div>
                  <h3 className="font-semibold text-sm text-gray-100 mb-2">Terms & Conditions</h3>
                  <p className="text-gray-500 text-xs mb-6">{data.terms}</p>
                  
                  <div className="flex gap-12">
                    <div>
                      <p className="text-gray-500 text-[10px] uppercase tracking-wider mb-1">Bank Name</p>
                      <p className="text-sm font-semibold text-gray-100">{data.bankName}</p>
                    </div>
                    <div>
                      <p className="text-gray-500 text-[10px] uppercase tracking-wider mb-1">Account #</p>
                      <p className="text-sm font-semibold text-gray-100">{data.accountNumber}</p>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
