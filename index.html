<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePro - Premium Studio</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { 
            uiBg: '#09090B',
            uiSidebar: '#121214',
            uiBorder: '#27272A',
            uiInput: '#18181B',
            uiAccent: '#3B82F6',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #09090B; color: #FAFAFA; overflow: hidden; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525B; }

    .input-pro { width: 100%; background-color: #18181B; border: 1px solid #27272A; color: #FAFAFA; padding: 0.625rem 0.75rem; border-radius: 0.375rem; font-size: 0.8125rem; transition: all 0.2s ease; outline: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .input-pro:focus { border-color: #3B82F6; box-shadow: 0 0 0 1px #3B82F6; }
    .label-pro { display: block; font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.05em; color: #A1A1AA; font-weight: 600; margin-bottom: 0.375rem; }
    .section-card { background: #121214; border: 1px solid #27272A; border-radius: 0.75rem; padding: 1.25rem; margin-bottom: 1rem; }
    .canvas-bg { background-image: radial-gradient(#27272A 1px, transparent 1px); background-size: 24px 24px; }
    .invoice-wrapper { min-width: 800px; width: 800px; }
  </style>
</head>
<body class="antialiased flex flex-col h-screen">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const defaultData = {
      currency: 'USD',
      fontFamily: "'Inter', sans-serif", 
      logoImage: null,
      clientEmail: '',
      billedToCompany: 'Company Name',
      billedToAddress: 'Company address\nCity, Country - 00000',
      billedToPhone: '+0 (000) 123-4567',
      invoiceNumber: '#AB2324-01',
      reference: 'dev',
      subject: 'Design System',
      invoiceDate: '01 Aug, 2026',
      dueDate: '15 Aug, 2026',
      items: [
        { id: 1, name: 'Item Name', description: 'Item description', qty: 1, rate: 3000 },
        { id: 2, name: 'Item Name', description: 'Item description', qty: 1, rate: 1500 }
      ],
      taxRate: 10,
      discount: 0,
      bankName: 'ABCD BANK',
      ifsCode: 'ABCD000XXXX',
      swiftCode: 'ABCDUSBBXXX',
      accountNumber: '3747489 2300011',
      terms: 'Please pay within 15 days of receiving this invoice.'
    };

    function App() {
      const invoiceRef = useRef(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [data, setData] = useState(defaultData);
      const [templateName, setTemplateName] = useState('');
      const [savedTemplates, setSavedTemplates] = useState({});

      useEffect(() => {
        lucide.createIcons();
        const savedDraft = localStorage.getItem('invoiceDraft_v4');
        const templates = localStorage.getItem('invoiceTemplates_v4');
        if (savedDraft) setData(JSON.parse(savedDraft));
        if (templates) setSavedTemplates(JSON.parse(templates));
      }, []);

      useEffect(() => { lucide.createIcons(); });
      useEffect(() => { localStorage.setItem('invoiceDraft_v4', JSON.stringify(data)); }, [data]);

      const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });
      const handleItemChange = (id, field, value) => {
        const updatedItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
        setData({ ...data, items: updatedItems });
      };
      const addItem = () => setData({ ...data, items: [...data.items, { id: Date.now(), name: '', description: '', qty: 1, rate: 0 }] });
      const removeItem = (id) => setData({ ...data, items: data.items.filter(item => item.id !== id) });
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setData({ ...data, logoImage: reader.result });
          reader.readAsDataURL(file);
        }
      };

      const saveTemplate = () => {
        if (!templateName) return alert("Enter template name");
        const updatedTemplates = { ...savedTemplates, [templateName]: data };
        setSavedTemplates(updatedTemplates);
        localStorage.setItem('invoiceTemplates_v4', JSON.stringify(updatedTemplates));
        setTemplateName('');
        alert("Template saved!");
      };

      const loadTemplate = (e) => {
        const selected = e.target.value;
        if (selected && savedTemplates[selected]) setData(savedTemplates[selected]);
      };

      const subtotal = data.items.reduce((acc, item) => acc + (Number(item.qty) * Number(item.rate)), 0);
      const discountAmount = Number(data.discount) || 0;
      const taxableAmount = Math.max(0, subtotal - discountAmount);
      const taxAmount = taxableAmount * (Number(data.taxRate) / 100);
      const total = taxableAmount + taxAmount;
      
      const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: data.currency }).format(amount);

      const handleDownloadPdf = async () => {
        setIsGenerating(true);
        const element = invoiceRef.current;
        element.style.transform = 'none'; 
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#050505', useCORS: true, windowWidth: 800 });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Invoice_${data.invoiceNumber}.pdf`);
        } catch(e) { console.error(e); } finally { setIsGenerating(false); }
      };

      const handleSendEmail = () => {
        const subject = encodeURIComponent(`Invoice ${data.invoiceNumber} for ${data.subject}`);
        const body = encodeURIComponent(
          `Dear ${data.billedToCompany},\n\n` +
          `I hope this email finds you well.\n\n` +
          `Please find attached the invoice (${data.invoiceNumber}) for the recent ${data.subject} services.\n\n` +
          `Invoice Summary:\n` +
          `• Invoice Date: ${data.invoiceDate}\n` +
          `• Due Date: ${data.dueDate}\n` +
          `• Total Amount Due: ${formatCurrency(total)}\n\n` +
          `For your convenience, payment can be made via wire transfer using the details provided within the attached document or below:\n` +
          `• Bank Name: ${data.bankName}\n` +
          `• Account Number: ${data.accountNumber}\n` +
          `• SWIFT Code: ${data.swiftCode}\n\n` +
          `If you have any questions regarding this invoice, please don't hesitate to reach out. We greatly appreciate your business!\n\n` +
          `Best regards,\n\n` +
          `[Your Name/Company]`
        );
        window.location.href = `mailto:${data.clientEmail}?subject=${subject}&body=${body}`;
      };

      return (
        <React.Fragment>
          {/* GLOBAL TOP NAVIGATION BAR - Actions always visible here */}
          <header className="h-16 flex-shrink-0 border-b border-uiBorder bg-uiSidebar px-4 lg:px-6 flex justify-between items-center z-30">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded bg-uiAccent flex items-center justify-center font-bold text-white shadow-lg">I</div>
              <h1 className="text-lg font-bold tracking-tight text-white hidden sm:block">InvoicePro</h1>
              <span className="text-[10px] text-green-400 bg-green-400/10 px-2 py-0.5 rounded border border-green-400/20 flex items-center gap-1 ml-2">
                <i data-lucide="check-circle" className="w-3 h-3"></i> Auto-Saved
              </span>
            </div>
            
            {/* Action Buttons Pinned to Top Right */}
            <div className="flex items-center gap-3">
              <button onClick={handleDownloadPdf} disabled={isGenerating} className="px-4 py-2 bg-uiAccent hover:bg-blue-500 text-white font-semibold rounded-md transition shadow flex items-center gap-2 disabled:opacity-50 text-sm">
                {isGenerating ? <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> : <i data-lucide="download" className="w-4 h-4"></i>}
                <span className="hidden sm:inline">{isGenerating ? 'Exporting...' : 'Download PDF'}</span>
                <span className="sm:hidden">{isGenerating ? '...' : 'PDF'}</span>
              </button>
              <button onClick={handleSendEmail} className="px-4 py-2 bg-white hover:bg-gray-200 text-black font-semibold rounded-md transition flex items-center gap-2 text-sm group relative">
                <i data-lucide="send" className="w-4 h-4"></i>
                <span className="hidden sm:inline">Draft Email</span>
                <span className="sm:hidden">Email</span>
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE */}
          <div className="flex flex-col lg:flex-row flex-1 overflow-hidden w-full bg-uiBg font-sans text-sm">
            
            {/* LEFT SIDEBAR: THE EDITOR */}
            <aside className="w-full lg:w-[420px] flex-shrink-0 flex flex-col bg-uiSidebar border-r border-uiBorder h-full z-20">
              <div className="flex-1 overflow-y-auto p-5 custom-scrollbar pb-10">
                
                {/* Settings & Templates */}
                <div className="section-card">
                  <div className="flex items-center gap-2 mb-4 text-white"><i data-lucide="settings" className="w-4 h-4 text-uiAccent"></i><h2 className="font-semibold">Preferences</h2></div>
                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <div>
                      <label className="label-pro">Font Style</label>
                      <select name="fontFamily" value={data.fontFamily} onChange={handleChange} className="input-pro">
                        <option value="'Inter', sans-serif">Inter (Clean)</option>
                        <option value="'Roboto', sans-serif">Roboto (Tech)</option>
                        <option value="'Montserrat', sans-serif">Montserrat</option>
                        <option value="'Lato', sans-serif">Lato (Professional)</option>
                        <option value="'Playfair Display', serif">Playfair (Serif)</option>
                      </select>
                    </div>
                    <div>
                      <label className="label-pro">Currency</label>
                      <select name="currency" value={data.currency} onChange={handleChange} className="input-pro">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="INR">INR (₹)</option>
                      </select>
                    </div>
                  </div>
                  <div className="pt-3 border-t border-uiBorder">
                    <label className="label-pro">Template Manager</label>
                    <select onChange={loadTemplate} className="input-pro mb-2 text-gray-400">
                      <option value="">Load saved template...</option>
                      {Object.keys(savedTemplates).map(name => <option key={name} value={name}>{name}</option>)}
                    </select>
                    <div className="flex gap-2">
                      <input type="text" value={templateName} onChange={(e) => setTemplateName(e.target.value)} placeholder="Template Name" className="input-pro" />
                      <button onClick={saveTemplate} className="bg-uiBorder hover:bg-zinc-700 px-3 rounded text-white text-xs font-medium transition">Save</button>
                    </div>
                  </div>
                </div>

                {/* Invoice Meta */}
                <div className="section-card">
                  <div className="flex items-center gap-2 mb-4 text-white"><i data-lucide="file-text" className="w-4 h-4 text-uiAccent"></i><h2 className="font-semibold">Document Details</h2></div>
                  <div className="grid grid-cols-2 gap-3 mb-3">
                    <div className="col-span-2">
                      <label className="label-pro">Brand Logo</label>
                      {data.logoImage ? (
                        <div className="flex items-center justify-between bg-uiInput p-2 rounded-md border border-uiBorder"><img src={data.logoImage} alt="Logo" className="h-6 object-contain" /><button onClick={() => setData({ ...data, logoImage: null })} className="text-red-400 text-xs hover:text-red-300">Remove</button></div>
                      ) : (
                        <input type="file" accept="image/*" onChange={handleLogoUpload} className="input-pro p-1.5 text-[10px] text-gray-400 file:mr-3 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:bg-zinc-700 file:text-white cursor-pointer" />
                      )}
                    </div>
                    <div><label className="label-pro">Invoice #</label><input type="text" name="invoiceNumber" value={data.invoiceNumber} onChange={handleChange} className="input-pro" /></div>
                    <div><label className="label-pro">Reference</label><input type="text" name="reference" value={data.reference} onChange={handleChange} className="input-pro" /></div>
                    <div><label className="label-pro">Issue Date</label><input type="text" name="invoiceDate" value={data.invoiceDate} onChange={handleChange} className="input-pro" /></div>
                    <div><label className="label-pro">Due Date</label><input type="text" name="dueDate" value={data.dueDate} onChange={handleChange} className="input-pro" /></div>
                    <div className="col-span-2"><label className="label-pro">Project / Subject</label><input type="text" name="subject" value={data.subject} onChange={handleChange} className="input-pro" /></div>
                  </div>
                </div>

                {/* Client Info */}
                <div className="section-card">
                  <div className="flex items-center gap-2 mb-4 text-white"><i data-lucide="user" className="w-4 h-4 text-uiAccent"></i><h2 className="font-semibold">Client Information</h2></div>
                  <div className="space-y-3">
                    <div><label className="label-pro">Client Email (For Draft)</label><input type="email" name="clientEmail" value={data.clientEmail} onChange={handleChange} placeholder="client@company.com" className="input-pro" /></div>
                    <div><label className="label-pro">Company Name</label><input type="text" name="billedToCompany" value={data.billedToCompany} onChange={handleChange} className="input-pro" /></div>
                    <div><label className="label-pro">Billing Address</label><textarea name="billedToAddress" value={data.billedToAddress} onChange={handleChange} className="input-pro h-14 resize-none"></textarea></div>
                    <div><label className="label-pro">Phone Number</label><input type="text" name="billedToPhone" value={data.billedToPhone} onChange={handleChange} className="input-pro" /></div>
                  </div>
                </div>

                {/* Line Items */}
                <div className="section-card">
                  <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-2 text-white"><i data-lucide="list" className="w-4 h-4 text-uiAccent"></i><h2 className="font-semibold">Line Items</h2></div>
                    <button onClick={addItem} className="text-[10px] bg-uiBorder hover:bg-zinc-700 px-2 py-1 rounded text-white transition flex items-center gap-1"><i data-lucide="plus" className="w-3 h-3"></i> Add Row</button>
                  </div>
                  <div className="space-y-3">
                    {data.items.map((item) => (
                      <div key={item.id} className="bg-uiInput/50 p-3 rounded-md border border-uiBorder relative group">
                        <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-zinc-500 hover:text-red-400 transition"><i data-lucide="x" className="w-4 h-4"></i></button>
                        <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} placeholder="Service / Item Name" className="input-pro mb-2 bg-uiInput pr-8 font-medium" />
                        <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} placeholder="Details..." className="input-pro mb-2 h-10 resize-none bg-uiInput"></textarea>
                        <div className="flex gap-2">
                          <div className="w-1/3"><label className="label-pro">Qty</label><input type="number" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} className="input-pro bg-uiInput" /></div>
                          <div className="w-2/3"><label className="label-pro">Rate</label><input type="number" value={item.rate} onChange={(e) => handleItemChange(item.id, 'rate', e.target.value)} className="input-pro bg-uiInput" /></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Financials & Terms */}
                <div className="section-card mb-0">
                  <div className="flex items-center gap-2 mb-4 text-white"><i data-lucide="credit-card" className="w-4 h-4 text-uiAccent"></i><h2 className="font-semibold">Financials & Payment</h2></div>
                  <div className="grid grid-cols-2 gap-3 mb-4">
                    <div><label className="label-pro">Tax Rate (%)</label><input type="number" name="taxRate" value={data.taxRate} onChange={handleChange} className="input-pro" /></div>
                    <div><label className="label-pro">Discount ({data.currency})</label><input type="number" name="discount" value={data.discount} onChange={handleChange} className="input-pro" /></div>
                  </div>
                  <div className="space-y-3 pt-3 border-t border-uiBorder">
                    <div><label className="label-pro">Bank Name</label><input type="text" name="bankName" value={data.bankName} onChange={handleChange} className="input-pro" /></div>
                    <div className="grid grid-cols-2 gap-3">
                      <div><label className="label-pro">Account #</label><input type="text" name="accountNumber" value={data.accountNumber} onChange={handleChange} className="input-pro" /></div>
                      <div><label className="label-pro">SWIFT Code</label><input type="text" name="swiftCode" value={data.swiftCode} onChange={handleChange} className="input-pro" /></div>
                    </div>
                    <div><label className="label-pro">Terms</label><textarea name="terms" value={data.terms} onChange={handleChange} className="input-pro h-12 resize-none"></textarea></div>
                  </div>
                </div>
              </div>
            </aside>

            {/* RIGHT SIDE: THE CANVAS (Live Preview) */}
            <main className="flex-1 h-full overflow-auto bg-uiBg canvas-bg flex justify-start lg:justify-center p-8 lg:p-12 relative custom-scrollbar">
              
              {/* The Invoice Document (STRICT FORMAT PRESERVATION) */}
              <div className="drop-shadow-2xl h-fit mb-20 flex-shrink-0">
                <div 
                  ref={invoiceRef} 
                  className="invoice-wrapper bg-[#050505] text-white p-14 relative"
                  style={{ fontFamily: data.fontFamily }}
                >
                  {/* Header Area */}
                  <div className="mb-16 pt-2 flex flex-col justify-start items-start">
                    {data.logoImage ? (
                      <img src={data.logoImage} alt="Logo" className="h-10 object-contain mb-6" />
                    ) : (
                      <p className="text-gray-400 text-xs font-semibold tracking-wider mb-4">Your Logo</p>
                    )}
                    <h1 className="text-4xl font-bold tracking-widest text-white uppercase">INVOICE <span className="text-xs text-gray-500 font-normal tracking-normal normal-case ml-2">(1 of 1)</span></h1>
                  </div>

                  {/* Top Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Billed to</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.billedToCompany}</p>
                      <p className="text-gray-400 text-[11px] whitespace-pre-line leading-relaxed mt-1">{data.billedToAddress}</p>
                      <p className="text-gray-400 text-[11px] mt-1">{data.billedToPhone}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice number</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.invoiceNumber}</p>
                      <p className="text-gray-500 text-[9px] mt-8 mb-2 uppercase tracking-widest font-semibold">Reference</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.reference}</p>
                    </div>
                    <div className="col-span-2 text-right flex flex-col justify-start items-end">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice of ({data.currency})</p>
                      <p className="text-[28px] font-bold text-white leading-none">{formatCurrency(total)}</p>
                    </div>
                  </div>

                  {/* Dates Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Subject</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.subject}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Invoice Date</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.invoiceDate}</p>
                    </div>
                    <div className="col-span-2 text-right">
                      <p className="text-gray-500 text-[9px] mb-2 uppercase tracking-widest font-semibold">Due Date</p>
                      <p className="font-bold text-[13px] text-gray-100">{data.dueDate}</p>
                    </div>
                  </div>

                  {/* Items Table */}
                  <div className="mb-12">
                    <div className="flex pb-3 mb-4 border-b border-[#1A1A1A]">
                      <div className="w-1/2 text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Item Detail</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Qty</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Rate</div>
                      <div className="w-1/6 text-right text-gray-500 text-[9px] uppercase tracking-widest font-semibold">Amount</div>
                    </div>
                    
                    {data.items.map((item) => (
                      <div key={item.id} className="flex py-3 border-b border-[#1A1A1A]/50">
                        <div className="w-1/2 pr-6">
                          <p className="font-bold text-[13px] text-gray-100">{item.name}</p>
                          <p className="text-gray-500 text-[11px] mt-1 leading-relaxed">{item.description}</p>
                        </div>
                        <div className="w-1/6 text-right text-[12px] text-gray-300">{item.qty}</div>
                        <div className="w-1/6 text-right text-[12px] text-gray-300">{formatCurrency(item.rate)}</div>
                        <div className="w-1/6 text-right text-[13px] font-bold text-gray-100">{formatCurrency(item.qty * item.rate)}</div>
                      </div>
                    ))}
                  </div>

                  {/* Calculations */}
                  <div className="flex justify-end mb-16">
                    <div className="w-72">
                      <div className="flex justify-between py-1.5 text-[13px]">
                        <span className="text-gray-400">Subtotal</span>
                        <span className="text-gray-200">{formatCurrency(subtotal)}</span>
                      </div>
                      {discountAmount > 0 && (
                        <div className="flex justify-between py-1.5 text-[13px]">
                          <span className="text-gray-400">Discount</span>
                          <span className="text-gray-200">-{formatCurrency(discountAmount)}</span>
                        </div>
                      )}
                      <div className="flex justify-between py-1.5 text-[13px] border-b border-[#1A1A1A] pb-3">
                        <span className="text-gray-400">Tax ({data.taxRate}%)</span>
                        <span className="text-gray-200">{formatCurrency(taxAmount)}</span>
                      </div>
                      <div className="flex justify-between py-3 mt-1">
                        <span className="font-bold text-[15px] text-white">Total</span>
                        <span className="font-bold text-[15px] text-white">{formatCurrency(total)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Footer Terms */}
                  <div className="pt-8">
                    <h3 className="font-bold text-[12px] text-gray-100 mb-1">Terms & Conditions</h3>
                    <p className="text-gray-500 text-[10px] mb-8 max-w-lg leading-relaxed">{data.terms}</p>
                    
                    <div className="grid grid-cols-[90px_1fr] gap-y-1 gap-x-4 max-w-sm">
                      <p className="text-gray-500 text-[10px]">Bank name</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.bankName}</p>
                      <p className="text-gray-500 text-[10px]">IFS code</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.ifsCode}</p>
                      <p className="text-gray-500 text-[10px]">Swift code</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.swiftCode}</p>
                      <p className="text-gray-500 text-[10px]">Account #</p>
                      <p className="text-[11px] font-bold text-gray-200">{data.accountNumber}</p>
                    </div>
                  </div>

                </div>
              </div>
            </main>
          </div>
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
