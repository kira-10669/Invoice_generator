<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePro - Advanced</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { bgPrimary: '#0a192f', accent: '#3b82f6', surface: '#1e293b', textMain: '#f8fafc' }
        }
      }
    }
  </script>

  <style>
    body { background-color: #0a192f; color: #f8fafc; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a192f; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    .glass-panel { background-color: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(248, 250, 252, 0.08); border-radius: 1rem; }
    .input-modern { width: 100%; background-color: rgba(10, 25, 47, 0.5); border: 1px solid rgba(248, 250, 252, 0.1); color: #f8fafc; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; transition: all 0.3s ease; outline: none; }
    .input-modern:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .input-label { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-bottom: 0.375rem; }
    .invoice-wrapper { min-width: 800px; }
    .ambient-glow { position: absolute; top: -10%; right: -5%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(10,25,47,0) 70%); z-index: 0; pointer-events: none; }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Default state template
    const defaultData = {
      currency: 'USD',
      accentColor: '#ffffff', // Default white for that minimal look
      logoImage: null,
      clientEmail: '',
      billedToCompany: '',
      billedToAddress: '',
      billedToPhone: '',
      invoiceNumber: '#INV-001',
      reference: '',
      subject: '',
      invoiceDate: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
      dueDate: '',
      items: [{ id: 1, name: '', description: '', qty: 1, rate: 0 }],
      taxRate: 0,
      discount: 0,
      bankName: '',
      ifsCode: '',
      swiftCode: '',
      accountNumber: '',
      terms: 'Please pay within 15 days of receiving this invoice via direct wire transfer.'
    };

    function App() {
      const invoiceRef = useRef(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [data, setData] = useState(defaultData);
      
      // Template State
      const [templateName, setTemplateName] = useState('');
      const [savedTemplates, setSavedTemplates] = useState({});

      // FEATURE 1: Auto-Save / Load from LocalStorage
      useEffect(() => {
        const savedDraft = localStorage.getItem('invoiceDraft');
        const templates = localStorage.getItem('invoiceTemplates');
        if (savedDraft) setData(JSON.parse(savedDraft));
        if (templates) setSavedTemplates(JSON.parse(templates));
      }, []);

      useEffect(() => {
        localStorage.setItem('invoiceDraft', JSON.stringify(data));
      }, [data]);

      // Handle Input Changes
      const handleChange = (e) => setData({ ...data, [e.target.name]: e.target.value });
      const handleItemChange = (id, field, value) => {
        const updatedItems = data.items.map(item => item.id === id ? { ...item, [field]: value } : item);
        setData({ ...data, items: updatedItems });
      };
      const addItem = () => setData({ ...data, items: [...data.items, { id: Date.now(), name: '', description: '', qty: 1, rate: 0 }] });
      const removeItem = (id) => setData({ ...data, items: data.items.filter(item => item.id !== id) });
      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setData({ ...data, logoImage: reader.result });
          reader.readAsDataURL(file);
        }
      };

      // FEATURE 4: Template Manager
      const saveTemplate = () => {
        if (!templateName) return alert("Please enter a template name");
        const updatedTemplates = { ...savedTemplates, [templateName]: data };
        setSavedTemplates(updatedTemplates);
        localStorage.setItem('invoiceTemplates', JSON.stringify(updatedTemplates));
        setTemplateName('');
        alert(`Template "${templateName}" saved!`);
      };

      const loadTemplate = (e) => {
        const selected = e.target.value;
        if (selected && savedTemplates[selected]) {
          setData(savedTemplates[selected]);
        }
      };

      // Calculations & FEATURE 2: Currency Formatter
      const subtotal = data.items.reduce((acc, item) => acc + (Number(item.qty) * Number(item.rate)), 0);
      const discountAmount = Number(data.discount) || 0;
      const taxableAmount = Math.max(0, subtotal - discountAmount);
      const taxAmount = taxableAmount * (Number(data.taxRate) / 100);
      const total = taxableAmount + taxAmount;
      
      const formatCurrency = (amount) => {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: data.currency }).format(amount);
      };

      // Generate PDF
      const handleDownloadPdf = async () => {
        setIsGenerating(true);
        const element = invoiceRef.current;
        element.style.transform = 'none'; 
        try {
          const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0a0a0a', useCORS: true, windowWidth: 800 });
          const imgData = canvas.toDataURL('image/png');
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Invoice_${data.invoiceNumber}.pdf`);
        } catch(e) { console.error(e); } finally { setIsGenerating(false); }
      };

      // Draft Email
      const handleSendEmail = () => {
        const subject = encodeURIComponent(`Invoice ${data.invoiceNumber} for ${data.subject}`);
        const body = encodeURIComponent(
          `Dear ${data.billedToCompany},\n\n` +
          `I hope this email finds you well.\n\n` +
          `Please find attached the invoice (${data.invoiceNumber}) for the recent ${data.subject} services.\n\n` +
          `Invoice Summary:\n` +
          `• Invoice Date: ${data.invoiceDate}\n` +
          `• Due Date: ${data.dueDate}\n` +
          `• Total Amount Due: ${formatCurrency(total)}\n\n` +
          `For your convenience, payment can be made via wire transfer using the details provided within the attached document or below:\n` +
          `• Bank Name: ${data.bankName}\n` +
          `• Account Number: ${data.accountNumber}\n` +
          `• SWIFT Code: ${data.swiftCode}\n\n` +
          `If you have any questions regarding this invoice, please don't hesitate to reach out. We greatly appreciate your business!\n\n` +
          `Best regards,\n\n` +
          `[Your Name/Company]`
        );
        window.location.href = `mailto:${data.clientEmail}?subject=${subject}&body=${body}`;
      };

      return (
        <div className="relative min-h-screen flex flex-col font-sans selection:bg-accent selection:text-white pb-20 lg:pb-0">
          <div className="ambient-glow"></div>

          {/* Header */}
          <header className="relative z-10 p-4 lg:p-6 border-b border-white/5 bg-surface/30 backdrop-blur-md flex flex-col lg:flex-row justify-between items-center gap-4">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded bg-gradient-to-br from-accent to-blue-700 flex items-center justify-center font-bold text-white shadow-lg">I</div>
              <h1 className="text-xl font-bold tracking-tight">Invoice<span className="text-accent">Pro</span></h1>
              <span className="ml-2 text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded-full border border-green-500/30">Auto-Saving enabled</span>
            </div>
            <div className="flex flex-wrap justify-center items-center gap-3">
              <button onClick={handleDownloadPdf} disabled={isGenerating} className="px-5 py-2.5 bg-accent hover:bg-blue-400 text-white font-bold rounded-lg transition shadow-[0_0_15px_rgba(59,130,246,0.3)] disabled:opacity-50 text-sm">
                {isGenerating ? 'Building...' : '1. Download PDF'}
              </button>
              <button onClick={handleSendEmail} className="px-4 py-2.5 bg-surface hover:bg-gray-700 text-white font-semibold rounded-lg transition border border-white/10 text-sm flex items-center gap-2 group relative">
                ✉️ 2. Draft Email
                <span className="absolute -bottom-8 left-1/2 -translate-x-1/2 text-[10px] text-gray-400 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">
                  *Remember to attach the PDF manually!
                </span>
              </button>
            </div>
          </header>
          
          <main className="flex flex-col xl:flex-row flex-1 relative z-10 p-4 lg:p-8 gap-8">
            
            {/* LEFT SIDEBAR: CONFIG & CALCULATOR */}
            <div className="w-full xl:w-[450px] flex flex-col gap-6">
              
              {/* FEATURE 2, 3 & 4: Settings & Templates */}
              <div className="glass-panel p-6 shadow-xl border-accent/30">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="text-accent">⚙️</span> Settings & Templates</h2>
                
                <div className="grid grid-cols-2 gap-4 mb-4 border-b border-white/10 pb-4">
                  <div>
                    <label className="input-label">Currency</label>
                    <select name="currency" value={data.currency} onChange={handleChange} className="input-modern bg-gray-800">
                      <option value="USD">USD ($)</option>
                      <option value="EUR">EUR (€)</option>
                      <option value="GBP">GBP (£)</option>
                      <option value="INR">INR (₹)</option>
                      <option value="AUD">AUD ($)</option>
                      <option value="CAD">CAD ($)</option>
                    </select>
                  </div>
                  <div>
                    <label className="input-label">Accent Color</label>
                    <div className="flex items-center gap-2">
                      <input type="color" name="accentColor" value={data.accentColor} onChange={handleChange} className="h-10 w-full rounded bg-gray-800 border-none cursor-pointer" />
                      <button onClick={() => setData({...data, accentColor: '#ffffff'})} className="text-xs text-gray-400 hover:text-white">Reset</button>
                    </div>
                  </div>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="input-label">Load Template</label>
                    <select onChange={loadTemplate} className="input-modern bg-gray-800 text-gray-300">
                      <option value="">-- Select a saved template --</option>
                      {Object.keys(savedTemplates).map(name => (
                        <option key={name} value={name}>{name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={templateName} onChange={(e) => setTemplateName(e.target.value)} placeholder="Template Name (e.g. Client A)" className="input-modern text-xs" />
                    <button onClick={saveTemplate} className="bg-surface hover:bg-gray-600 px-3 rounded text-white text-xs font-bold border border-white/10">Save</button>
                  </div>
                </div>
              </div>

              {/* Setup Panel */}
              <div className="glass-panel p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="text-accent">01.</span> Branding & Details</h2>
                <div className="mb-4">
                  <label className="input-label">Company Logo</label>
                  {data.logoImage ? (
                    <div className="flex items-center justify-between bg-bgPrimary/50 p-3 rounded-lg border border-white/5">
                      <img src={data.logoImage} alt="Logo" className="h-8 object-contain" />
                      <button onClick={() => setData({ ...data, logoImage: null })} className="text-red-400 text-xs font-bold">Remove</button>
                    </div>
                  ) : (
                    <input type="file" accept="image/*" onChange={handleLogoUpload} className="input-modern p-2 text-xs" />
                  )}
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="input-label">Invoice #</label><input type="text" name="invoiceNumber" value={data.invoiceNumber} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Reference</label><input type="text" name="reference" value={data.reference} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Invoice Date</label><input type="text" name="invoiceDate" value={data.invoiceDate} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Due Date</label><input type="text" name="dueDate" value={data.dueDate} onChange={handleChange} className="input-modern" /></div>
                  <div className="col-span-2"><label className="input-label">Subject</label><input type="text" name="subject" value={data.subject} onChange={handleChange} className="input-modern" /></div>
                </div>
              </div>

              {/* Client & Email Panel */}
              <div className="glass-panel p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="text-accent">02.</span> Client Delivery Details</h2>
                <div className="space-y-3">
                  <div><label className="input-label">Client Email (For Auto-Mail)</label><input type="email" name="clientEmail" value={data.clientEmail} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Company Name</label><input type="text" name="billedToCompany" value={data.billedToCompany} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Address</label><textarea name="billedToAddress" value={data.billedToAddress} onChange={handleChange} className="input-modern h-16 resize-none"></textarea></div>
                  <div><label className="input-label">Phone</label><input type="text" name="billedToPhone" value={data.billedToPhone} onChange={handleChange} className="input-modern" /></div>
                </div>
              </div>

              {/* Line Items Panel */}
              <div className="glass-panel p-6 shadow-xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold flex items-center gap-2"><span className="text-accent">03.</span> Line Items</h2>
                  <button onClick={addItem} className="text-xs bg-surface hover:bg-gray-600 px-3 py-1.5 rounded text-white font-bold">+ Add Item</button>
                </div>
                <div className="space-y-4">
                  {data.items.map((item) => (
                    <div key={item.id} className="bg-bgPrimary/40 p-4 rounded-xl border border-white/5 relative group">
                      <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-red-400 text-xs">✕</button>
                      <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} placeholder="Item Name" className="input-modern mb-2 text-xs font-bold" />
                      <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} placeholder="Description" className="input-modern h-12 mb-2 text-xs resize-none"></textarea>
                      <div className="flex gap-2">
                        <div className="w-1/3"><label className="input-label">Qty</label><input type="number" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} className="input-modern text-xs" /></div>
                        <div className="w-2/3"><label className="input-label">Rate</label><input type="number" value={item.rate} onChange={(e) => handleItemChange(item.id, 'rate', e.target.value)} className="input-modern text-xs" /></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Calculator & Bank Panel */}
              <div className="glass-panel p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2"><span className="text-accent">04.</span> Financials & Bank</h2>
                <div className="grid grid-cols-2 gap-4 mb-4">
                  <div><label className="input-label">Tax Rate (%)</label><input type="number" name="taxRate" value={data.taxRate} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Flat Discount ({data.currency})</label><input type="number" name="discount" value={data.discount} onChange={handleChange} className="input-modern" /></div>
                </div>
                <div className="space-y-3 pt-4 border-t border-white/5">
                  <div><label className="input-label">Bank Name</label><input type="text" name="bankName" value={data.bankName} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Account Number</label><input type="text" name="accountNumber" value={data.accountNumber} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">SWIFT / Routing</label><input type="text" name="swiftCode" value={data.swiftCode} onChange={handleChange} className="input-modern" /></div>
                  <div><label className="input-label">Terms & Conditions</label><textarea name="terms" value={data.terms} onChange={handleChange} className="input-modern h-16 resize-none"></textarea></div>
                </div>
              </div>

            </div>

            {/* RIGHT SIDE: LIVE INVOICE PREVIEW */}
            <div className="flex-1 flex justify-center items-start overflow-auto">
              <div className="overflow-x-auto w-full flex justify-center pb-12">
                <div ref={invoiceRef} className="invoice-wrapper w-[800px] bg-[#0a0a0a] text-white p-14 shadow-2xl rounded-sm border border-white/5 relative">
                  
                  {/* Decorative Accent Line (FEATURE 3: Accent Color) */}
                  <div className="absolute top-0 left-0 w-full h-2" style={{ backgroundColor: data.accentColor === '#ffffff' ? '#333' : data.accentColor }}></div>

                  {/* Header */}
                  <div className="mb-14 pt-4 flex justify-between items-start">
                    <div>
                      {data.logoImage ? (
                        <img src={data.logoImage} alt="Logo" className="h-10 object-contain mb-6" />
                      ) : (
                        <div className="h-10 mb-6"></div>
                      )}
                      <h1 className="text-5xl font-bold tracking-[0.2em]" style={{ color: data.accentColor }}>INVOICE</h1>
                    </div>
                  </div>

                  {/* Top Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Billed to</p>
                      <p className="font-bold text-sm text-gray-100">{data.billedToCompany}</p>
                      <p className="text-gray-400 text-xs whitespace-pre-line leading-relaxed mt-1">{data.billedToAddress}</p>
                      <p className="text-gray-400 text-xs mt-1">{data.billedToPhone}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Invoice number</p>
                      <p className="font-bold text-sm text-gray-100">{data.invoiceNumber}</p>
                      <p className="text-gray-500 text-[10px] mt-8 mb-2 uppercase tracking-widest font-semibold">Reference</p>
                      <p className="font-bold text-sm text-gray-100">{data.reference}</p>
                    </div>
                    <div className="col-span-2 text-right">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Invoice of ({data.currency})</p>
                      <p className="text-4xl font-bold" style={{ color: data.accentColor }}>{formatCurrency(total)}</p>
                    </div>
                  </div>

                  {/* Dates Grid */}
                  <div className="grid grid-cols-4 gap-8 mb-12">
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Subject</p>
                      <p className="font-bold text-sm text-gray-100">{data.subject}</p>
                    </div>
                    <div className="col-span-1">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Invoice Date</p>
                      <p className="font-bold text-sm text-gray-100">{data.invoiceDate}</p>
                    </div>
                    <div className="col-span-2 text-right">
                      <p className="text-gray-500 text-[10px] mb-2 uppercase tracking-widest font-semibold">Due Date</p>
                      <p className="font-bold text-sm text-gray-100">{data.dueDate}</p>
                    </div>
                  </div>

                  {/* Items Table */}
                  <div className="mb-12">
                    <div className="flex pb-3 mb-6" style={{ borderBottom: `1px solid ${data.accentColor === '#ffffff' ? '#333' : data.accentColor}` }}>
                      <div className="w-1/2 text-gray-500 text-[10px] uppercase tracking-widest font-semibold">Item Detail</div>
                      <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-widest font-semibold">Qty</div>
                      <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-widest font-semibold">Rate</div>
                      <div className="w-1/6 text-right text-gray-500 text-[10px] uppercase tracking-widest font-semibold">Amount</div>
                    </div>
                    
                    {data.items.map((item) => (
                      <div key={item.id} className="flex py-4 border-b border-gray-800/60">
                        <div className="w-1/2 pr-6">
                          <p className="font-bold text-sm text-gray-100">{item.name}</p>
                          <p className="text-gray-400 text-xs mt-1.5 leading-relaxed">{item.description}</p>
                        </div>
                        <div className="w-1/6 text-right text-sm text-gray-300">{item.qty}</div>
                        <div className="w-1/6 text-right text-sm text-gray-300">{formatCurrency(item.rate)}</div>
                        <div className="w-1/6 text-right text-sm font-bold text-gray-100">{formatCurrency(item.qty * item.rate)}</div>
                      </div>
                    ))}
                  </div>

                  {/* Automatic Calculator Summary */}
                  <div className="flex justify-end mb-16">
                    <div className="w-72 space-y-2">
                      <div className="flex justify-between py-1 text-sm">
                        <span className="text-gray-400">Subtotal</span>
                        <span className="text-gray-200">{formatCurrency(subtotal)}</span>
                      </div>
                      {discountAmount > 0 && (
                        <div className="flex justify-between py-1 text-sm text-green-400">
                          <span>Discount</span>
                          <span>-{formatCurrency(discountAmount)}</span>
                        </div>
                      )}
                      <div className="flex justify-between py-1 text-sm border-b border-gray-800 pb-2">
                        <span className="text-gray-400">Tax ({data.taxRate}%)</span>
                        <span className="text-gray-200">+{formatCurrency(taxAmount)}</span>
                      </div>
                      <div className="flex justify-between py-3 px-4 rounded mt-2" style={{ backgroundColor: data.accentColor === '#ffffff' ? '#111' : `${data.accentColor}20` }}>
                        <span className="font-bold text-lg text-white">Total</span>
                        <span className="font-bold text-lg" style={{ color: data.accentColor }}>{formatCurrency(total)}</span>
                      </div>
                    </div>
                  </div>

                  {/* Footer Terms */}
                  <div>
                    <h3 className="font-bold text-sm text-gray-100 mb-2">Terms & Conditions</h3>
                    <p className="text-gray-500 text-xs mb-8">{data.terms}</p>
                    
                    <div className="flex gap-16">
                      <div>
                        <p className="text-gray-500 text-[10px] uppercase tracking-widest font-semibold mb-1">Bank Name</p>
                        <p className="text-sm font-bold text-gray-100">{data.bankName}</p>
                      </div>
                      <div>
                        <p className="text-gray-500 text-[10px] uppercase tracking-widest font-semibold mb-1">Account #</p>
                        <p className="text-sm font-bold text-gray-100">{data.accountNumber}</p>
                      </div>
                      <div>
                        <p className="text-gray-500 text-[10px] uppercase tracking-widest font-semibold mb-1">SWIFT</p>
                        <p className="text-sm font-bold text-gray-100">{data.swiftCode}</p>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
